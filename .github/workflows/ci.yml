name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      package-version:
        description: Resolved preview version for a publish run
        type: string
        default: ''

permissions:
  contents: read

env:
  PACKAGE_VERSION: ${{ inputs.package-version }}
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Whether this run has anything to test. A change whose every path is under docs/evidence/ or is
  # docs/roadmap/SharedLibraries*.md skips the jobs below; Shared libraries still runs on it. The list
  # may hold only paths that no test, build or generator reads: M8ValidationTests reads other files
  # under docs/ (architecture, compliance, roadmap/Component.md and Measurement.md, public-api.md), and
  # the scripts filed in evidence bundles are run by no test. git diff has no limit on the number of
  # paths, which a paths-ignore filter has (300). A publish (workflow_call with a version), a dispatch,
  # and a push whose earlier commit cannot be read run everything.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      # Depth 2: a pull request's merge commit and the base it was merged onto.
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Compare with the base
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          run_all() {
            echo "$1, so every job runs."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          [ -z "${PACKAGE_VERSION:-}" ] || run_all "A publish run validates $PACKAGE_VERSION"
          case "$EVENT" in
            pull_request)
              base="$(git rev-parse HEAD^1)"
              ;;
            push)
              [ "$REF" = refs/heads/main ] || run_all "A push to $REF"
              if [ -z "$BEFORE" ] || [ -z "${BEFORE//0/}" ]; then
                run_all "The push has no earlier commit"
              fi
              git fetch --no-tags --depth=1 origin "$BEFORE" || run_all "The push's earlier commit $BEFORE cannot be fetched"
              base="$BEFORE"
              ;;
            *)
              run_all "A $EVENT run"
              ;;
          esac
          changed="$RUNNER_TEMP/changed-paths.txt"
          git -c core.quotePath=false diff --name-only --no-renames "$base" HEAD > "$changed"
          echo "$(wc -l < "$changed") path(s) differ from $base."
          others="$(grep -Ev '^(docs/evidence/|docs/roadmap/SharedLibraries[^/]*\.md$)' "$changed" || true)"
          if [ ! -s "$changed" ]; then
            run_all "No path differs"
          elif [ -n "$others" ]; then
            echo "Paths outside the records, the first 20:"
            head -n 20 <<< "$others"
            run_all "The change is not records alone"
          fi
          echo "Every changed path is a record no test reads, so the build and test jobs are skipped."
          echo "code=false" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.os }} / Release
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Test preview version selection
        run: node --test eng/resolve-preview-version.test.mjs

      # The performance configuration and architecture checks, which otherwise run only in the weekly
      # Performance baselines workflow. They read files and need no build.
      - name: Test the performance configuration
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s scripts/performance/tests -v

      - name: Build
        run: |
          args=()
          if [ -n "$PACKAGE_VERSION" ]; then
            args+=("-p:Version=$PACKAGE_VERSION" "-p:PackageVersion=$PACKAGE_VERSION")
          fi
          dotnet build Broiler.JS.slnx -c Release --nologo "${args[@]}"

      # The engine corpus (Category=EngineCorpus) runs in the engine vectors job below.
      - name: Test
        run: bash ./eng/run-tests.sh Release --filter "Category!=EngineCorpus"

      - name: Pack and verify every package
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./eng/pack.ps1 -Version $env:PACKAGE_VERSION

      - name: Verify consumer restore from nuget.org (dry run)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./eng/verify-feed.ps1

      - name: Upload packages
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/*
          if-no-files-found: error

  # Broiler.JS's engine-level run of the whole vector corpus (Broiler.JavaScript.Vectors.Tests,
  # Category=EngineCorpus) in four evaluating processes on the runner's four cores. Its report is the one a
  # single process writes, byte for byte, and a vector that finds no completion within 5 s in the parallel
  # pass is run again alone (conformance/vectors/README.md). The test's output line gives N, the elapsed
  # time and the slowest vector's time; the report is kept as an artifact.
  vectors:
    name: engine vectors (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      BROILER_VECTORS_WORKERS: '4'
      BROILER_VECTORS_REPORT: engine-vectors.tsv
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: |
          args=()
          if [ -n "$PACKAGE_VERSION" ]; then
            args+=("-p:Version=$PACKAGE_VERSION" "-p:PackageVersion=$PACKAGE_VERSION")
          fi
          dotnet build Broiler.JS/Broiler.JavaScript.Vectors.Tests -c Release --nologo "${args[@]}"

      - name: Run the corpus
        run: >
          dotnet test Broiler.JS/Broiler.JavaScript.Vectors.Tests -c Release --no-build --nologo
          --filter "Category=EngineCorpus" --logger "console;verbosity=detailed"

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: engine-vectors-${{ matrix.os }}
          path: engine-vectors.tsv
          if-no-files-found: warn
