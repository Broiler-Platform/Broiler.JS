name: Shared libraries

# The shared JavaScript libraries' own gate (Broiler.ECMAScript/, milestones SJL-2.11 to SJL-2.14),
# run on every change, as convention 12 asks of the Native AOT probe:
#   - the folder builds under its conventions and its tests pass, the SL rules among them, and on
#     Linux the time data home's zone table agrees with the host's zic (milestone SJL-8.2);
#   - the Native AOT probe publishes with Broiler.VM's root settings and no warning, runs the whole
#     vector corpus, and gives the report the same probe gives under the JIT; the probe is also
#     published with the JIT (PublishAot off, framework-dependent, its own folder) with no
#     warning, and that publication's report is compared with the Native AOT image's, line for
#     line, as is the build's (bundle sjl-13-001's part D, as its rule's revisions of 2026-11-03
#     read it);
#   - the Hairs assurance check holds the folder to its generated artefacts (rule SL8; Hairs.Cli since
#     2026-11-08, where it read "the Broiler Code Assurance check");
#   - the shared version stream packs, passes package validation, and restores in a pristine
#     consumer from an isolated cache.
# Publish-shared calls it with a resolved version before anything is pushed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      package-version:
        description: Resolved version of the shared stream for a publish run
        type: string
        default: ''

permissions:
  contents: read

# A later run on the same ref cancels a pull request's or a dispatch's run. A push has a group of
# its own, its commit's, so that no later push or dispatch cancels it: bundle sjl-13-001's part D
# reads the first attempt of the push run at its part D commit.
concurrency:
  group: shared-${{ github.workflow }}-${{ github.ref }}-${{ inputs.package-version }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and SL rules (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      # Rule SL7 runs the corpus generator.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      # The Date area's population tests read zones through zoneinfo, which reads the host's tzdata;
      # Windows has none, so there it reads the tzdata package.
      - name: Time-zone data for zoneinfo (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install --disable-pip-version-check tzdata==2025.2
      - name: Build
        run: dotnet build Broiler.ECMAScript.slnf -c Release --nologo
      - name: Test, the SL rules among them
        run: dotnet test Broiler.ECMAScript.slnf -c Release --no-build --nologo
      - name: The corpus generator's own tests
        run: python -m unittest discover -s scripts/conformance/tests -v
      # Milestone SJL-8's data-home exit clause 3: the generated zone table against the host's zic -b fat
      # over the nine pinned tz files, 1800 to 2037. Linux runners have zic; Windows has none.
      - name: The zone table against zic (Linux)
        if: runner.os == 'Linux'
        run: python -I Broiler.ECMAScript/data/time/tzdb/check-zic.py

  native-aot-probe:
    name: Native AOT probe (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
            executable: Broiler.ECMAScript.Probe
          - os: windows-latest
            rid: win-x64
            executable: Broiler.ECMAScript.Probe.exe
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish with Native AOT
        run: |
          set -o pipefail
          dotnet publish Broiler.ECMAScript/Broiler.ECMAScript.Probe -c Release -r ${{ matrix.rid }} --nologo 2>&1 | tee probe-publish.log
          # Warnings are errors already; this states the zero the exit clause asks for.
          if grep -E "warning [A-Z]+[0-9]+" probe-publish.log; then
            echo "::error::the Native AOT publish reported a warning"
            exit 1
          fi
          publish=Broiler.ECMAScript/Broiler.ECMAScript.Probe/bin/Release/net10.0/${{ matrix.rid }}/publish
          if ls "$publish"/*.dll >/dev/null 2>&1; then
            echo "::error::the publish directory holds a managed assembly"
            exit 1
          fi
      - name: Run the corpus under Native AOT
        run: ./Broiler.ECMAScript/Broiler.ECMAScript.Probe/bin/Release/net10.0/${{ matrix.rid }}/publish/${{ matrix.executable }} conformance/vectors --report probe-aot.tsv
      # The JIT publication: the same project and settings with PublishAot off, framework-dependent
      # and portable (no runtime identifier), into a folder of its own beside the Native AOT
      # image's. The command is the one bundle sjl-13-001 took locally for its rule's part D but
      # for that folder, and it is the same on both legs: without a runtime identifier the
      # publication does not depend on the runner's, and each leg runs it on its own runtime.
      - name: Publish with the JIT
        run: |
          set -o pipefail
          dotnet publish Broiler.ECMAScript/Broiler.ECMAScript.Probe -c Release -p:PublishAot=false -o Broiler.ECMAScript/Broiler.ECMAScript.Probe/bin/Release/net10.0/jit-publish --nologo 2>&1 | tee probe-publish-jit.log
          # Warnings are errors already; this states the zero the exit clause asks for.
          if grep -E "warning [A-Z]+[0-9]+" probe-publish-jit.log; then
            echo "::error::the JIT publish reported a warning"
            exit 1
          fi
      - name: Run the corpus under the JIT publication, and compare
        run: |
          dotnet Broiler.ECMAScript/Broiler.ECMAScript.Probe/bin/Release/net10.0/jit-publish/Broiler.ECMAScript.Probe.dll conformance/vectors --report probe-jit-published.tsv
          cmp probe-aot.tsv probe-jit-published.tsv
      - name: Run the corpus under the JIT, and compare
        run: |
          dotnet build Broiler.ECMAScript/Broiler.ECMAScript.Probe -c Release --nologo
          dotnet Broiler.ECMAScript/Broiler.ECMAScript.Probe/bin/Release/net10.0/Broiler.ECMAScript.Probe.dll conformance/vectors --report probe-jit.tsv
          cmp probe-aot.tsv probe-jit.tsv
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-aot-probe-${{ matrix.rid }}
          path: |
            probe-publish.log
            probe-aot.tsv
            probe-publish-jit.log
            probe-jit-published.tsv
            probe-jit.tsv
          if-no-files-found: warn

  assurance:
    name: Assurance check (SL8)
    runs-on: ubuntu-24.04
    steps:
      # The assurance tool is Hairs.Cli, pinned in .config/dotnet-tools.json and restored from nuget.org
      # (NuGet.config), the command Broiler.ECMAScript/hairs.config.json's regenerateCommand names, run
      # from the repository's root. (Changed 2026-11-08, when Broiler.Code's commit 1b31684 "Switch to
      # Hairs" removed its review CLI and the owner chose to migrate to Hairs. The job read: "The
      # assurance tool lives in Broiler.Code. The two are checked out side by side, the layout
      # Broiler.ECMAScript/assurance.config.json's regenerateCommand names", checked out this
      # repository to Broiler.JS and Broiler-Platform/Broiler.Code to Broiler.Code with
      # secrets.BROILER_CODE_TOKEN or the workflow's token, and ran "dotnet run --project
      # Broiler.Code/src/Broiler.Code.Review.Cli -c Release -- assurance check --root
      # Broiler.JS/Broiler.ECMAScript".)
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore the pinned Hairs.Cli from nuget.org
        run: dotnet tool restore --configfile NuGet.config
      - name: Check the shared folder against its generated artefacts
        run: dotnet tool run hairs -- assurance check --root Broiler.ECMAScript

  pack:
    name: Pack, validate and restore the shared stream (dry run)
    runs-on: ubuntu-24.04
    env:
      PACKAGE_VERSION: ${{ inputs.package-version }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      # Package validation runs inside pack (EnablePackageValidation); a first version is validated
      # without a baseline, a later one against the last published version.
      - name: Pack the shared stream
        shell: pwsh
        run: ./eng/pack.ps1 -ProjectSet Shared -Version $env:PACKAGE_VERSION -Output artifacts/shared
      - name: Restore the set in an isolated cache, nuget.org for everything else
        shell: pwsh
        run: ./eng/verify-feed.ps1 -Packages artifacts/shared
      - name: Restore and run a pristine consumer from a local feed alone
        run: python scripts/packaging/test_pristine_consumer.py --set shared ${PACKAGE_VERSION:+--version "$PACKAGE_VERSION"}
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: shared-packages
          path: artifacts/shared/*
          if-no-files-found: error
