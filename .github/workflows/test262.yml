name: test262

# Manual, full-suite test262 runner with deterministic sharding, a fast
# previously-failing preflight, one retry for abnormally aborted shards, merged
# reporting, four focused GitHub issues, and scope-aware failure persistence.
# A valid JSON report is conclusive even when tests failed; only a missing or
# malformed report is retried. The retry artifact supersedes its first attempt.

on:
  workflow_dispatch:
    inputs:
      assembly:
        description: Broiler.JS assembly scope, or all for the full script-host-verifiable suite.
        required: false
        default: all
        type: choice
        options:
          - all
          - parser
          - compiler
          - runtime
          - builtins
          - intl
          - annexb
      subset:
        description: Semicolon-separated test262 path, prefix, or glob patterns; empty means all paths in the assembly scope.
        required: false
        default: ''
        type: string
      features:
        description: Semicolon-separated test262 feature-name patterns with optional wildcards; empty means all features.
        required: false
        default: ''
        type: string
      feature_match:
        description: Match any or all requested feature patterns.
        required: false
        default: any
        type: choice
        options:
          - any
          - all
      minifier:
        description: >-
          Run eligible tests as both original and minified variants, or original only.
          terser applies the conservative test262-safe mangle; closure applies Google
          Closure Compiler's ADVANCED_OPTIMIZATIONS against the ES2026 standard, which
          also renames properties and is far slower per test.
        required: false
        default: terser
        type: choice
        options:
          - terser
          - closure
          - none
      suite_ref:
        description: test262 branch, tag, ref, or commit; resolved to an immutable commit before sharding.
        required: false
        default: ccaac100ff49d81e9ff47a75ff4c60e0bd3f262e
        type: string
      rerun_failed_only:
        description: Rerun saved failures first, then run the requested full phase only when the preflight passes.
        required: false
        default: true
        type: boolean
      shard_index:
        description: Zero-based shard index to execute, or -1 for all shards.
        required: false
        default: -1
        type: number
      test_timeout_seconds:
        description: Per-test wall-clock timeout in seconds.
        required: false
        default: 30
        type: number
      minifier_timeout_seconds:
        description: Per-test minifier transformation timeout in seconds.
        required: false
        default: 30
        type: number
      memory_limit_mb:
        description: Per-test POSIX memory cap in MiB; 0 disables it.
        required: false
        default: 0
        type: number
      max_workers:
        description: Parallel worker count per shard; 1 is serial.
        required: false
        default: 1
        type: number
      shuffle_seed:
        description: Deterministic random-order seed; empty keeps the selected order.
        required: false
        default: ''
        type: string
      include_negative:
        description: Include negative-metadata tests and verify their expected errors.
        required: false
        default: false
        type: boolean
      prioritize_fragile:
        description: Run historically fragile and recently changed areas first.
        required: false
        default: false
        type: boolean
      most_common_problems_limit:
        description: Maximum common failure groups in the frequency-focused issue.
        required: false
        default: 10
        type: number
      biggest_problems_limit:
        description: Maximum failure groups in the impact-focused issue.
        required: false
        default: 3
        type: number
      timeout_problems_limit:
        description: Maximum timed-out tests in the timeout-focused issue.
        required: false
        default: 10
        type: number
      minifier_only_problems_limit:
        description: Maximum cases in the minifier-only issue for tests that pass as original source and fail once minified.
        required: false
        default: 10
        type: number

permissions:
  contents: write
  issues: write

env:
  CANONICAL_TEST262_REF: ccaac100ff49d81e9ff47a75ff4c60e0bd3f262e
  SHARD_COUNT: '8'
  TEST262_ROOT: ${{ github.workspace }}/.cache/test262
  FAILED_TESTS_FILE: scripts/compliance/test262-failures.txt
  MOST_COMMON_PROBLEMS_LIMIT: ${{ github.event.inputs.most_common_problems_limit || '10' }}
  BIGGEST_PROBLEMS_LIMIT: ${{ github.event.inputs.biggest_problems_limit || '3' }}
  TIMEOUT_PROBLEMS_LIMIT: ${{ github.event.inputs.timeout_problems_limit || '10' }}
  MINIFIER_ONLY_PROBLEMS_LIMIT: ${{ github.event.inputs.minifier_only_problems_limit || '10' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        if: ${{ (github.event.inputs.minifier || 'terser') != 'none' }}
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            .github/actions/run-test262-shard/terser/package-lock.json
            .github/actions/run-test262-shard/closure/package-lock.json
      - name: Validate pinned Terser worker
        if: ${{ (github.event.inputs.minifier || 'terser') == 'terser' }}
        shell: bash
        env:
          TERSER_PREFIX: ${{ github.workspace }}/.github/actions/run-test262-shard/terser
        run: |
          set -euo pipefail
          npm ci --prefix "$TERSER_PREFIX" --ignore-scripts --no-audit --no-fund
          module="$(node -e 'const path=require("node:path"); process.stdout.write(path.dirname(require.resolve("terser/package.json", {paths:[process.argv[1]]})))' "$TERSER_PREFIX")"
          python - "$module" <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import sys

          module = sys.argv[1]
          worker = Path("scripts/compliance/terser_worker.cjs").resolve()
          requests = [
              {"id": 1, "operation": "hello"},
              {
                  "id": 2,
                  "operation": "minify",
                  "path": "validation.js",
                  "source": (
                      "function preservedName(longArgument) { "
                      "var quotedName = 1, mangledName = 2; "
                      "return longArgument + quotedName + mangledName + 'quotedName'; } "
                      "preservedName(2);"
                  ),
              },
          ]
          try:
              completed = subprocess.run(
                  ["node", str(worker), module],
                  input="\n".join(json.dumps(request) for request in requests) + "\n",
                  text=True,
                  capture_output=True,
                  check=False,
                  timeout=30,
              )
          except subprocess.TimeoutExpired:
              sys.exit("Terser worker validation timed out after 30 seconds")
          if completed.returncode != 0:
              sys.exit(
                  f"Terser worker exited {completed.returncode}: {completed.stderr.strip()}"
              )
          try:
              hello, transformed = [
                  json.loads(line) for line in completed.stdout.splitlines() if line.strip()
              ]
          except (ValueError, json.JSONDecodeError) as exc:
              sys.exit(f"Terser worker returned an invalid response: {exc}")
          if hello != {
              "id": 1,
              "ok": True,
              "profile": "test262-safe-mangle-v2",
              "version": "5.50.0",
          }:
              sys.exit(f"Unexpected Terser worker handshake: {hello!r}")
          code = transformed.get("code") if transformed.get("ok") is True else None
          if not isinstance(code, str) or "longArgument" in code or "preservedName" not in code:
              sys.exit(f"Unexpected Terser transformation response: {transformed!r}")
          # The profile mangles a local the test does not name and holds back the one it
          # quotes, so a name an assertion compares against still exists in the output.
          if "mangledName" in code or code.count("quotedName") < 2:
              sys.exit(f"Terser transformation did not reserve quoted names: {code!r}")
          if transformed.get("reserved") != ["quotedName"]:
              sys.exit(f"Unexpected Terser reserved-name report: {transformed!r}")
          PY

      # The same smoke the Terser step runs, against the transformation this profile
      # actually applies: ADVANCED renames a property the test does not name, keeps the one
      # the test quotes (Closure's equivalent of Terser's reserved list is an externs
      # declaration), and leaves the harness API the externs declare alone. Two stub harness
      # files stand in for the pinned suite, which this job does not check out.
      - name: Validate pinned Closure Compiler worker
        if: ${{ (github.event.inputs.minifier || 'terser') == 'closure' }}
        shell: bash
        env:
          CLOSURE_PREFIX: ${{ github.workspace }}/.github/actions/run-test262-shard/closure
        run: |
          set -euo pipefail
          npm ci --prefix "$CLOSURE_PREFIX" --ignore-scripts --no-audit --no-fund
          module="$(node -e 'const path=require("node:path"); process.stdout.write(path.dirname(require.resolve("google-closure-compiler/package.json", {paths:[process.argv[1]]})))' "$CLOSURE_PREFIX")"
          python - "$module" <<'PY'
          import json
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          module = sys.argv[1]
          worker = Path("scripts/compliance/closure_worker.cjs").resolve()
          harness_stubs = {
              "assert.js": (
                  "function assert(mustBeTrue, message) {}\n"
                  "assert.sameValue = function (actual, expected, message) {};\n"
                  "assert.throws = function (constructor, func, message) {};\n"
              ),
              "sta.js": (
                  "function Test262Error(message) {}\n"
                  "Test262Error.thrower = function (message) {};\n"
              ),
          }
          # Stands in for the externs the runner generates from the engine's own globals:
          # a name the host owns must survive ADVANCED even though the test never quotes it.
          host_externs = (
              "/** @fileoverview @externs */\n"
              "/** @type {?} */ var __broilerTest262HostNames;\n"
              "__broilerTest262HostNames.hostOwnedName;\n"
          )
          requests = [
              {"id": 1, "operation": "hello"},
              {
                  "id": 2,
                  "operation": "minify",
                  "path": "validation.js",
                  "source": (
                      "var holder = { quotedName: 1, mangledName: 2, hostOwnedName: 3 };\n"
                      "unpredictableGlobal(holder);\n"
                      "assert.sameValue(holder.quotedName, 1, 'quotedName');\n"
                      "assert.sameValue(holder.mangledName, 2);\n"
                      "assert.sameValue(holder.hostOwnedName, 3);\n"
                  ),
              },
          ]
          with tempfile.TemporaryDirectory() as harness:
              for name, text in harness_stubs.items():
                  Path(harness, name).write_text(text, encoding="utf-8")
              externs_path = Path(harness, "test262-host-surface.js")
              externs_path.write_text(host_externs, encoding="utf-8")
              try:
                  completed = subprocess.run(
                      ["node", str(worker), module, harness, "60000", str(externs_path)],
                      input="\n".join(json.dumps(request) for request in requests) + "\n",
                      text=True,
                      capture_output=True,
                      check=False,
                      timeout=180,
                  )
              except subprocess.TimeoutExpired:
                  sys.exit("Closure worker validation timed out after 180 seconds")
          if completed.returncode != 0:
              sys.exit(
                  f"Closure worker exited {completed.returncode}: {completed.stderr.strip()}"
              )
          try:
              hello, transformed = [
                  json.loads(line) for line in completed.stdout.splitlines() if line.strip()
              ]
          except (ValueError, json.JSONDecodeError) as exc:
              sys.exit(f"Closure worker returned an invalid response: {exc}")
          if hello != {
              "id": 1,
              "ok": True,
              "profile": "test262-closure-advanced-v1",
              "version": "20260816.0.0",
              "compilationLevel": "ADVANCED_OPTIMIZATIONS",
              "language": "ECMASCRIPT_NEXT",
              "languageYear": 2026,
          }:
              sys.exit(f"Unexpected Closure worker handshake: {hello!r}")
          code = transformed.get("code") if transformed.get("ok") is True else None
          if not isinstance(code, str) or "holder" in code:
              sys.exit(f"Unexpected Closure transformation response: {transformed!r}")
          if "assert.sameValue" not in code:
              sys.exit(f"Closure renamed the harness API the externs declare: {code!r}")
          if "hostOwnedName" not in code:
              sys.exit(f"Closure renamed a name the host's own externs declare: {code!r}")
          if "mangledName" in code or code.count("quotedName") < 2:
              sys.exit(f"Closure did not reserve exactly the quoted names: {code!r}")
          if transformed.get("reserved") != ["quotedName"]:
              sys.exit(f"Unexpected Closure reserved-name report: {transformed!r}")
          PY
      - name: Install compliance-test dependency
        shell: bash
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Run test262 runner and workflow regression tests
        shell: bash
        run: python -m unittest discover -s scripts/compliance/tests -v

  # Resolve both phase matrices. A targeted/custom run bypasses the global
  # saved-failure preflight so unrelated failures cannot block the requested
  # assembly, subset, feature slice, alternate suite, or negative-test run.
  plan:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      full-shard-matrix: ${{ steps.resolve.outputs.full-shard-matrix }}
      full-expected-shards: ${{ steps.resolve.outputs.full-expected-shards }}
      failed-shard-matrix: ${{ steps.resolve.outputs.failed-shard-matrix }}
      failed-shard-count: ${{ steps.resolve.outputs.failed-shard-count }}
      failed-expected-shards: ${{ steps.resolve.outputs.failed-expected-shards }}
      should-rerun-failed: ${{ steps.resolve.outputs.should-rerun-failed }}
      targeted-run: ${{ steps.resolve.outputs.targeted-run }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve test262 run plan
        id: resolve
        shell: bash
        env:
          SELECTED_SHARD_INDEX: ${{ github.event.inputs.shard_index || '-1' }}
          RERUN_FAILED_ONLY: ${{ github.event.inputs.rerun_failed_only || 'true' }}
          ASSEMBLY: ${{ github.event.inputs.assembly || 'all' }}
          SUBSET: ${{ github.event.inputs.subset || '' }}
          FEATURES: ${{ github.event.inputs.features || '' }}
          REQUESTED_SUITE_REF: ${{ github.event.inputs.suite_ref || 'ccaac100ff49d81e9ff47a75ff4c60e0bd3f262e' }}
          INCLUDE_NEGATIVE: ${{ github.event.inputs.include_negative || 'false' }}
          MINIFIER: ${{ github.event.inputs.minifier || 'terser' }}
          TEST_TIMEOUT_SECONDS: ${{ github.event.inputs.test_timeout_seconds || '30' }}
          MINIFIER_TIMEOUT_SECONDS: ${{ github.event.inputs.minifier_timeout_seconds || '30' }}
          MEMORY_LIMIT_MB: ${{ github.event.inputs.memory_limit_mb || '0' }}
          MAX_WORKERS: ${{ github.event.inputs.max_workers || '1' }}
          SHUFFLE_SEED: ${{ github.event.inputs.shuffle_seed || '' }}
          COMMON_LIMIT: ${{ github.event.inputs.most_common_problems_limit || '10' }}
          BIGGEST_LIMIT: ${{ github.event.inputs.biggest_problems_limit || '3' }}
          TIMEOUT_LIMIT: ${{ github.event.inputs.timeout_problems_limit || '10' }}
          MINIFIER_ONLY_LIMIT: ${{ github.event.inputs.minifier_only_problems_limit || '10' }}
        run: |
          python <<'PY'
          import json
          import math
          import os
          import sys
          from pathlib import Path

          shard_count = int(os.environ["SHARD_COUNT"])
          raw_index = os.environ["SELECTED_SHARD_INDEX"]
          try:
              selected = int(raw_index)
          except ValueError:
              sys.exit(f"shard_index must be an integer, got {raw_index!r}")

          if selected == -1:
              full_matrix = [{"shard-index": index} for index in range(shard_count)]
          elif 0 <= selected < shard_count:
              full_matrix = [{"shard-index": selected}]
          else:
              sys.exit(
                  f"shard_index must be -1 or between 0 and {shard_count - 1}, got {selected}"
              )

          try:
              timeout = float(os.environ["TEST_TIMEOUT_SECONDS"])
          except ValueError:
              sys.exit("test_timeout_seconds must be a number")
          if not math.isfinite(timeout) or timeout <= 0:
              sys.exit("test_timeout_seconds must be finite and positive")

          try:
              minifier_timeout = float(os.environ["MINIFIER_TIMEOUT_SECONDS"])
          except ValueError:
              sys.exit("minifier_timeout_seconds must be a number")
          if not math.isfinite(minifier_timeout) or minifier_timeout <= 0:
              sys.exit("minifier_timeout_seconds must be finite and positive")

          minifier = os.environ["MINIFIER"].strip().lower()
          if minifier not in {"none", "terser", "closure"}:
              sys.exit("minifier must be one of 'terser', 'closure', or 'none'")

          def checked_integer(name, minimum, maximum=None):
              raw = os.environ[name]
              try:
                  value = int(raw)
              except ValueError:
                  sys.exit(f"{name.lower()} must be an integer, got {raw!r}")
              if value < minimum or (maximum is not None and value > maximum):
                  bounds = f">= {minimum}"
                  if maximum is not None:
                      bounds += f" and <= {maximum}"
                  sys.exit(f"{name.lower()} must be {bounds}, got {value}")
              return value

          checked_integer("MEMORY_LIMIT_MB", 0)
          checked_integer("MAX_WORKERS", 1, 256)
          checked_integer("COMMON_LIMIT", 1, 100)
          checked_integer("BIGGEST_LIMIT", 1, 100)
          checked_integer("TIMEOUT_LIMIT", 1, 100)
          checked_integer("MINIFIER_ONLY_LIMIT", 1, 100)
          if os.environ["SHUFFLE_SEED"].strip():
              checked_integer("SHUFFLE_SEED", -(2**63), 2**63 - 1)

          failed_file = Path(os.environ["FAILED_TESTS_FILE"])
          failed_paths = []
          if failed_file.is_file():
              failed_paths = [
                  line.strip()
                  for line in failed_file.read_text(encoding="utf-8").splitlines()
                  if line.strip() and not line.lstrip().startswith("#")
              ]

          targeted = any(
              (
                  os.environ["ASSEMBLY"].strip() not in ("", "all"),
                  bool(os.environ["SUBSET"].strip()),
                  bool(os.environ["FEATURES"].strip()),
                  os.environ["REQUESTED_SUITE_REF"].strip().lower()
                      != os.environ["CANONICAL_TEST262_REF"].lower(),
                  os.environ["INCLUDE_NEGATIVE"].strip().lower() == "true",
              )
          )
          rerun_requested = os.environ["RERUN_FAILED_ONLY"].strip().lower() == "true"
          should_rerun = rerun_requested and not targeted and bool(failed_paths)

          # Preserve the existing small-preflight optimization when every shard
          # was selected. A requested single shard remains indexed in the stable
          # eight-shard space, including index zero.
          failed_shard_count = shard_count
          if should_rerun and selected == -1:
              failed_shard_count = max(1, min(shard_count, len(failed_paths)))

          if selected == -1:
              failed_matrix = [
                  {"shard-index": index} for index in range(failed_shard_count)
              ]
          else:
              failed_matrix = [{"shard-index": selected}]

          def expected(matrix):
              return ",".join(str(entry["shard-index"]) for entry in matrix)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"full-shard-matrix={json.dumps(full_matrix)}\n")
              handle.write(f"full-expected-shards={expected(full_matrix)}\n")
              handle.write(f"failed-shard-matrix={json.dumps(failed_matrix)}\n")
              handle.write(f"failed-shard-count={failed_shard_count}\n")
              handle.write(f"failed-expected-shards={expected(failed_matrix)}\n")
              handle.write(f"should-rerun-failed={'true' if should_rerun else 'false'}\n")
              handle.write(f"targeted-run={'true' if targeted else 'false'}\n")
          PY

  # Resolve mutable names before the matrix starts. Every shard and retry uses
  # this exact commit and cache key, so one run cannot straddle a moving branch.
  prepare:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      suite-commit: ${{ steps.resolve.outputs.suite-commit }}
      suite-cache-key: ${{ steps.resolve.outputs.suite-cache-key }}
    steps:
      - name: Resolve test262 ref to an immutable commit
        id: resolve
        shell: bash
        env:
          REQUESTED_SUITE_REF: ${{ github.event.inputs.suite_ref || 'ccaac100ff49d81e9ff47a75ff4c60e0bd3f262e' }}
        run: |
          python <<'PY'
          import os
          import re
          import subprocess
          import sys

          remote = "https://github.com/tc39/test262.git"
          requested = os.environ["REQUESTED_SUITE_REF"].strip()
          if not requested:
              sys.exit("suite_ref must not be empty")

          if re.fullmatch(r"[0-9a-fA-F]{40}", requested):
              commit = requested.lower()
          else:
              patterns = [requested, f"{requested}^{{}}"]
              if not requested.startswith("refs/"):
                  patterns.extend(
                      [
                          f"refs/heads/{requested}",
                          f"refs/tags/{requested}",
                          f"refs/tags/{requested}^{{}}",
                      ]
                  )
              result = subprocess.run(
                  ["git", "ls-remote", remote, *patterns],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              refs = {}
              for line in result.stdout.splitlines():
                  sha, ref = line.split("\t", 1)
                  refs[ref] = sha.lower()

              preferred = [
                  f"refs/tags/{requested}^{{}}",
                  f"{requested}^{{}}",
                  f"refs/heads/{requested}",
                  requested,
                  f"refs/tags/{requested}",
              ]
              commit = next((refs[ref] for ref in preferred if ref in refs), "")
              if not commit:
                  sys.exit(f"Unable to resolve test262 suite_ref {requested!r}")

          cache_key = f"test262-{os.environ['RUNNER_OS']}-{commit}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"suite-commit={commit}\n")
              handle.write(f"suite-cache-key={cache_key}\n")
          PY

      - name: Cache immutable test262 checkout
        id: suite-cache
        uses: actions/cache@v5
        with:
          path: ${{ env.TEST262_ROOT }}
          key: ${{ steps.resolve.outputs.suite-cache-key }}

      - name: Fetch immutable test262 checkout
        if: steps.suite-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          SUITE_COMMIT: ${{ steps.resolve.outputs.suite-commit }}
        run: |
          set -euo pipefail
          rm -rf "$TEST262_ROOT"
          git init "$TEST262_ROOT"
          git -C "$TEST262_ROOT" remote add origin https://github.com/tc39/test262.git
          git -C "$TEST262_ROOT" fetch --depth 1 --filter=blob:none origin "$SUITE_COMMIT"
          git -C "$TEST262_ROOT" checkout --detach "$SUITE_COMMIT"

      - name: Verify immutable checkout
        shell: bash
        env:
          SUITE_COMMIT: ${{ steps.resolve.outputs.suite-commit }}
        run: test "$(git -C "$TEST262_ROOT" rev-parse HEAD)" = "$SUITE_COMMIT"

  # ── Previously-failing preflight and its abnormal-abort retry ───────────
  rerun-failed:
    needs: [plan, prepare]
    if: ${{ needs.plan.outputs.should-rerun-failed == 'true' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.failed-shard-matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 2
      - uses: ./.github/actions/run-test262-shard
        with:
          phase: rerun
          shard-index: ${{ matrix.shard-index }}
          shard-count: ${{ needs.plan.outputs.failed-shard-count }}
          suite-commit: ${{ needs.prepare.outputs.suite-commit }}
          suite-root: ${{ env.TEST262_ROOT }}
          suite-cache-key: ${{ needs.prepare.outputs.suite-cache-key }}
          rerun-failed: 'true'
          failed-tests-file: ${{ env.FAILED_TESTS_FILE }}
          test-timeout-seconds: ${{ github.event.inputs.test_timeout_seconds || '30' }}
          minifier: ${{ github.event.inputs.minifier || 'terser' }}
          minifier-timeout-seconds: ${{ github.event.inputs.minifier_timeout_seconds || '30' }}
          memory-limit-mb: ${{ github.event.inputs.memory_limit_mb || '0' }}
          max-workers: ${{ github.event.inputs.max_workers || '1' }}
          shuffle-seed: ${{ github.event.inputs.shuffle_seed || '' }}
          include-negative: 'false'
          prioritize-fragile: ${{ github.event.inputs.prioritize_fragile || 'false' }}

  retry-plan-rerun:
    needs: [plan, rerun-failed]
    if: ${{ !cancelled() && needs.plan.outputs.should-rerun-failed == 'true' && needs.rerun-failed.result != 'skipped' }}
    runs-on: ubuntu-latest
    outputs:
      retry-matrix: ${{ steps.detect.outputs.incomplete_shard_matrix }}
      has-retries: ${{ steps.detect.outputs.has_incomplete_shards }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download rerun shard reports
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: test262-rerun-shard-*
          path: shard-results
          merge-multiple: true
      - name: Detect abnormal rerun shards
        id: detect
        shell: bash
        run: |
          mkdir -p shard-results
          python scripts/compliance/merge_test262_shards.py \
            --shard-dir shard-results \
            --phase rerun \
            --expected-shards "${{ needs.plan.outputs.failed-expected-shards }}" \
            --github-output "$GITHUB_OUTPUT"

  retry-rerun:
    needs: [plan, prepare, retry-plan-rerun]
    if: ${{ !cancelled() && needs.retry-plan-rerun.outputs.has-retries == 'true' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.retry-plan-rerun.outputs.retry-matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 2
      - uses: ./.github/actions/run-test262-shard
        with:
          phase: rerun
          shard-index: ${{ matrix.shard-index }}
          shard-count: ${{ needs.plan.outputs.failed-shard-count }}
          attempt-suffix: -retry
          suite-commit: ${{ needs.prepare.outputs.suite-commit }}
          suite-root: ${{ env.TEST262_ROOT }}
          suite-cache-key: ${{ needs.prepare.outputs.suite-cache-key }}
          rerun-failed: 'true'
          failed-tests-file: ${{ env.FAILED_TESTS_FILE }}
          test-timeout-seconds: ${{ github.event.inputs.test_timeout_seconds || '30' }}
          minifier: ${{ github.event.inputs.minifier || 'terser' }}
          minifier-timeout-seconds: ${{ github.event.inputs.minifier_timeout_seconds || '30' }}
          memory-limit-mb: ${{ github.event.inputs.memory_limit_mb || '0' }}
          max-workers: ${{ github.event.inputs.max_workers || '1' }}
          shuffle-seed: ${{ github.event.inputs.shuffle_seed || '' }}
          include-negative: 'false'
          prioritize-fragile: ${{ github.event.inputs.prioritize_fragile || 'false' }}

  # Merge preflight attempts before deciding whether the expensive full phase
  # may start. Test failures and a twice-aborted shard both keep suite_passed false.
  evaluate-rerun:
    needs: [plan, rerun-failed, retry-rerun]
    if: ${{ always() && !cancelled() && needs.plan.outputs.should-rerun-failed == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      suite-passed: ${{ steps.merge.outputs.suite_passed }}
      incomplete-shard-count: ${{ steps.merge.outputs.incomplete_shard_count }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download all rerun attempts
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: test262-rerun-shard-*
          path: shard-results
          merge-multiple: true
      - name: Evaluate authoritative rerun result
        id: merge
        shell: bash
        run: |
          mkdir -p shard-results rerun-evaluation
          python scripts/compliance/merge_test262_shards.py \
            --shard-dir shard-results \
            --phase rerun \
            --expected-shards "${{ needs.plan.outputs.failed-expected-shards }}" \
            --merged-json rerun-evaluation/test262-results.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Enforce the saved-failure preflight decision
        if: steps.merge.outputs.suite_passed != 'true'
        shell: bash
        run: |
          echo "The authoritative saved-failure preflight did not pass." >&2
          exit 1

  # ── Requested full/targeted phase and its abnormal-abort retry ──────────
  run-full:
    needs: [plan, prepare, evaluate-rerun]
    if: >-
      ${{
        always()
        && !cancelled()
        && needs.plan.result == 'success'
        && needs.prepare.result == 'success'
        && (
          needs.plan.outputs.should-rerun-failed != 'true'
          || needs.evaluate-rerun.outputs.suite-passed == 'true'
        )
      }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.full-shard-matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 2
      - uses: ./.github/actions/run-test262-shard
        with:
          phase: full
          shard-index: ${{ matrix.shard-index }}
          shard-count: ${{ env.SHARD_COUNT }}
          suite-commit: ${{ needs.prepare.outputs.suite-commit }}
          suite-root: ${{ env.TEST262_ROOT }}
          suite-cache-key: ${{ needs.prepare.outputs.suite-cache-key }}
          assembly: ${{ github.event.inputs.assembly || 'all' }}
          subset: ${{ github.event.inputs.subset || '' }}
          features: ${{ github.event.inputs.features || '' }}
          feature-match: ${{ github.event.inputs.feature_match || 'any' }}
          rerun-failed: 'false'
          failed-tests-file: ${{ env.FAILED_TESTS_FILE }}
          test-timeout-seconds: ${{ github.event.inputs.test_timeout_seconds || '30' }}
          minifier: ${{ github.event.inputs.minifier || 'terser' }}
          minifier-timeout-seconds: ${{ github.event.inputs.minifier_timeout_seconds || '30' }}
          memory-limit-mb: ${{ github.event.inputs.memory_limit_mb || '0' }}
          max-workers: ${{ github.event.inputs.max_workers || '1' }}
          shuffle-seed: ${{ github.event.inputs.shuffle_seed || '' }}
          include-negative: ${{ github.event.inputs.include_negative || 'false' }}
          prioritize-fragile: ${{ github.event.inputs.prioritize_fragile || 'false' }}

  retry-plan-full:
    needs: [plan, run-full]
    if: ${{ !cancelled() && needs.run-full.result != 'skipped' }}
    runs-on: ubuntu-latest
    outputs:
      retry-matrix: ${{ steps.detect.outputs.incomplete_shard_matrix }}
      has-retries: ${{ steps.detect.outputs.has_incomplete_shards }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download full shard reports
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: test262-full-shard-*
          path: shard-results
          merge-multiple: true
      - name: Detect abnormal full shards
        id: detect
        shell: bash
        run: |
          mkdir -p shard-results
          python scripts/compliance/merge_test262_shards.py \
            --shard-dir shard-results \
            --phase full \
            --expected-shards "${{ needs.plan.outputs.full-expected-shards }}" \
            --github-output "$GITHUB_OUTPUT"

  retry-full:
    needs: [plan, prepare, retry-plan-full]
    if: ${{ !cancelled() && needs.retry-plan-full.outputs.has-retries == 'true' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.retry-plan-full.outputs.retry-matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 2
      - uses: ./.github/actions/run-test262-shard
        with:
          phase: full
          shard-index: ${{ matrix.shard-index }}
          shard-count: ${{ env.SHARD_COUNT }}
          attempt-suffix: -retry
          suite-commit: ${{ needs.prepare.outputs.suite-commit }}
          suite-root: ${{ env.TEST262_ROOT }}
          suite-cache-key: ${{ needs.prepare.outputs.suite-cache-key }}
          assembly: ${{ github.event.inputs.assembly || 'all' }}
          subset: ${{ github.event.inputs.subset || '' }}
          features: ${{ github.event.inputs.features || '' }}
          feature-match: ${{ github.event.inputs.feature_match || 'any' }}
          rerun-failed: 'false'
          failed-tests-file: ${{ env.FAILED_TESTS_FILE }}
          test-timeout-seconds: ${{ github.event.inputs.test_timeout_seconds || '30' }}
          minifier: ${{ github.event.inputs.minifier || 'terser' }}
          minifier-timeout-seconds: ${{ github.event.inputs.minifier_timeout_seconds || '30' }}
          memory-limit-mb: ${{ github.event.inputs.memory_limit_mb || '0' }}
          max-workers: ${{ github.event.inputs.max_workers || '1' }}
          shuffle-seed: ${{ github.event.inputs.shuffle_seed || '' }}
          include-negative: ${{ github.event.inputs.include_negative || 'false' }}
          prioritize-fragile: ${{ github.event.inputs.prioritize_fragile || 'false' }}

  # The full phase is authoritative when it ran. If the saved-failure preflight
  # did not pass, that rerun phase is authoritative instead. All reports and
  # persistence consume the same resolved phase, including its retry artifacts.
  report:
    needs: [plan, rerun-failed, evaluate-rerun, run-full, retry-full]
    if: >-
      ${{
        always()
        && !cancelled()
        && (needs.run-full.result != 'skipped' || needs.rerun-failed.result != 'skipped')
      }}
    runs-on: ubuntu-latest
    outputs:
      authoritative-phase: ${{ steps.authoritative.outputs.phase }}
      authoritative-expected-shards: ${{ steps.authoritative.outputs.expected-shards }}
      incomplete-shard-count: ${{ steps.merge.outputs.incomplete_shard_count }}
      configuration-failure-count: ${{ steps.merge.outputs.configuration_failure_count }}
      suite-passed: ${{ steps.merge.outputs.suite_passed }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Resolve authoritative phase
        id: authoritative
        shell: bash
        env:
          FULL_RESULT: ${{ needs.run-full.result }}
          FULL_EXPECTED: ${{ needs.plan.outputs.full-expected-shards }}
          RERUN_EXPECTED: ${{ needs.plan.outputs.failed-expected-shards }}
        run: |
          if [ "$FULL_RESULT" != "skipped" ]; then
            echo "phase=full" >> "$GITHUB_OUTPUT"
            echo "expected-shards=$FULL_EXPECTED" >> "$GITHUB_OUTPUT"
          else
            echo "phase=rerun" >> "$GITHUB_OUTPUT"
            echo "expected-shards=$RERUN_EXPECTED" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all shard attempts
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: test262-*-shard-*
          path: shard-results
          merge-multiple: true

      - name: Merge authoritative shard reports
        id: merge
        shell: bash
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p shard-results test262-merged
          python scripts/compliance/merge_test262_shards.py \
            --shard-dir shard-results \
            --phase "${{ steps.authoritative.outputs.phase }}" \
            --expected-shards "${{ steps.authoritative.outputs.expected-shards }}" \
            --merged-json test262-merged/test262-results.json \
            --issue-md test262-merged/issue.md \
            --biggest-issue-md test262-merged/biggest-issue.md \
            --timeout-issue-md test262-merged/timeout-issue.md \
            --minifier-only-issue-md test262-merged/minifier-only-issue.md \
            --problem-limit "$MOST_COMMON_PROBLEMS_LIMIT" \
            --biggest-problem-limit "$BIGGEST_PROBLEMS_LIMIT" \
            --timeout-limit "$TIMEOUT_PROBLEMS_LIMIT" \
            --minifier-only-limit "$MINIFIER_ONLY_PROBLEMS_LIMIT" \
            --run-url "$RUN_URL" \
            --broiler-commit "${{ github.sha }}" \
            --artifact-name test262-merged \
            --github-output "$GITHUB_OUTPUT"

      - name: Publish merged summary
        if: always()
        shell: bash
        run: |
          if [ -f test262-merged/issue.md ]; then
            cat test262-merged/issue.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload canonical merged report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test262-merged
          path: test262-merged
          if-no-files-found: warn

      - name: Create GitHub issue for the most common failures
        if: steps.merge.outputs.create_issue == 'true'
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          FAILED_COUNT: ${{ steps.merge.outputs.failed_count }}
          TIMEOUT_COUNT: ${{ steps.merge.outputs.timeout_count }}
          INCOMPLETE_SHARD_COUNT: ${{ steps.merge.outputs.incomplete_shard_count }}
          CONFIGURATION_FAILURE_COUNT: ${{ steps.merge.outputs.configuration_failure_count }}
        with:
          github-token: ${{ secrets.ISSUE_TOKEN || github.token }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('test262-merged/issue.md', 'utf8').trim();
            const today = new Date().toISOString().slice(0, 10);
            const failed = Number(process.env.FAILED_COUNT || 0);
            const timedOut = Number(process.env.TIMEOUT_COUNT || 0);
            const incomplete = Number(process.env.INCOMPLETE_SHARD_COUNT || 0);
            const configuration = Number(process.env.CONFIGURATION_FAILURE_COUNT || 0);
            const parts = [];
            if (failed > 0) {
              const timeoutDetail = timedOut > 0 ? ` (${timedOut} timed out)` : '';
              parts.push(`${failed} non-passing variant case(s)${timeoutDetail}`);
            } else if (timedOut > 0) {
              // Keep the title informative if an older merger reports timeout
              // totals separately from its failed-count output.
              parts.push(`${timedOut} timed-out variant case(s)`);
            }
            if (incomplete > 0) parts.push(`${incomplete} incomplete shard(s)`);
            if (configuration > 0) parts.push(`${configuration} configuration problem(s)`);
            const summary = parts.join(', ') || 'reported problems';
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `test262 run: ${summary} (${today})`,
              body,
            });
            core.info(`Created issue #${issue.data.number}: ${issue.data.html_url}`);

      - name: Create GitHub issue for the biggest problems
        if: steps.merge.outputs.create_biggest_issue == 'true'
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          BIGGEST_PROBLEM_COUNT: ${{ steps.merge.outputs.biggest_problem_count }}
        with:
          github-token: ${{ secrets.ISSUE_TOKEN || github.token }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('test262-merged/biggest-issue.md', 'utf8').trim();
            const today = new Date().toISOString().slice(0, 10);
            const count = Number(process.env.BIGGEST_PROBLEM_COUNT || 0);
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `test262 run: top ${count} biggest problem(s) (${today})`,
              body,
            });
            core.info(`Created biggest-problems issue #${issue.data.number}: ${issue.data.html_url}`);

      - name: Create GitHub issue for the timed-out tests
        if: steps.merge.outputs.create_timeout_issue == 'true'
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          TIMEOUT_COUNT: ${{ steps.merge.outputs.timeout_count }}
        with:
          github-token: ${{ secrets.ISSUE_TOKEN || github.token }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('test262-merged/timeout-issue.md', 'utf8').trim();
            const today = new Date().toISOString().slice(0, 10);
            const count = Number(process.env.TIMEOUT_COUNT || 0);
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `test262 run: ${count} timed-out variant case(s) (${today})`,
              body,
            });
            core.info(`Created timeouts issue #${issue.data.number}: ${issue.data.html_url}`);

      # Minification-only regressions are the one class of failure the other
      # three issues cannot separate: the original source passes, so the defect
      # is only visible in the minified variant of the same base path.
      - name: Create GitHub issue for the minifier-only failures
        if: steps.merge.outputs.create_minifier_only_issue == 'true'
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          MINIFIED_VARIANT: ${{ steps.merge.outputs.minified_variant }}
          MINIFIER_ONLY_FAILURE_COUNT: ${{ steps.merge.outputs.minifier_only_failure_count }}
          MINIFIER_ONLY_PATH_COUNT: ${{ steps.merge.outputs.minifier_only_path_count }}
          MINIFIER_ONLY_INFRASTRUCTURE_FAILURE_COUNT: ${{ steps.merge.outputs.minifier_only_infrastructure_failure_count }}
        with:
          github-token: ${{ secrets.ISSUE_TOKEN || github.token }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('test262-merged/minifier-only-issue.md', 'utf8').trim();
            const today = new Date().toISOString().slice(0, 10);
            const variant = process.env.MINIFIED_VARIANT || 'minifier';
            const label = variant.charAt(0).toUpperCase() + variant.slice(1);
            const count = Number(process.env.MINIFIER_ONLY_FAILURE_COUNT || 0);
            const paths = Number(process.env.MINIFIER_ONLY_PATH_COUNT || 0);
            const minifierFailures = Number(
              process.env.MINIFIER_ONLY_INFRASTRUCTURE_FAILURE_COUNT || 0,
            );
            let scope = `${paths} base path(s)`;
            if (minifierFailures > 0) {
              scope += `, including ${minifierFailures} minifier failure(s)`;
            }
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title:
                `test262 run: ${count} ${label}-only failure(s) in ` +
                `${scope} (${today})`,
              body,
            });
            core.info(`Created ${label}-only issue #${issue.data.number}: ${issue.data.html_url}`);

  # Refresh only paths conclusively exercised by the authoritative phase. The
  # merger preserves failures outside a selected assembly/subset/shard and any
  # shard still incomplete after its retry. Alternate suites, negative-test runs,
  # original-only runs, and Closure runs never modify the canonical baseline: it
  # records the original-plus-Terser pair, and a Closure run measured a different
  # transformation entirely.
  persist-failed:
    needs: [prepare, report]
    if: >-
      ${{
        always()
        && !cancelled()
        && needs.report.result == 'success'
        && needs.report.outputs.configuration-failure-count == '0'
        && needs.prepare.outputs.suite-commit == 'ccaac100ff49d81e9ff47a75ff4c60e0bd3f262e'
        && github.event.inputs.include_negative != 'true'
        && (github.event.inputs.minifier || 'terser') == 'terser'
        && github.ref_type == 'branch'
      }}
    runs-on: ubuntu-latest
    concurrency:
      group: test262-failure-manifest-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # A second scoped run may have committed only this generated manifest
      # while we waited for the persistence lock; that is safe to merge on top
      # of. Any source change means these measurements describe an older engine,
      # so leave the newer branch untouched.
      - name: Verify the measured Broiler revision is still current
        id: freshness
        shell: bash
        env:
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          current="$(git rev-parse HEAD)"
          echo "base-sha=$current" >> "$GITHUB_OUTPUT"
          should_persist=true

          if ! git merge-base --is-ancestor "$DISPATCH_SHA" "$current"; then
            should_persist=false
          elif [ "$current" != "$DISPATCH_SHA" ]; then
            while IFS= read -r changed_path; do
              if [ -n "$changed_path" ] && [ "$changed_path" != "$FAILED_TESTS_FILE" ]; then
                should_persist=false
                break
              fi
            done < <(git diff --name-only "$DISPATCH_SHA..$current")
          fi

          echo "should-persist=$should_persist" >> "$GITHUB_OUTPUT"
          if [ "$should_persist" != "true" ]; then
            {
              echo "### test262 failure manifest"
              echo
              echo "Persistence skipped: the branch contains source changes newer than the tested commit \`$DISPATCH_SHA\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Download authoritative merged report
        if: steps.freshness.outputs.should-persist == 'true'
        uses: actions/download-artifact@v7
        with:
          name: test262-merged
          path: authoritative-report

      - name: Merge authoritative failures into canonical manifest
        if: steps.freshness.outputs.should-persist == 'true'
        shell: bash
        run: |
          python scripts/compliance/merge_test262_shards.py \
            --merged-input authoritative-report/test262-results.json \
            --merge-into "$FAILED_TESTS_FILE"

      - name: Commit canonical failure manifest
        if: steps.freshness.outputs.should-persist == 'true'
        shell: bash
        run: |
          bash scripts/ci-commit-generated-results.sh \
            --branch "${{ github.ref_name }}" \
            --expected-base "${{ steps.freshness.outputs.base-sha }}" \
            --message "ci: update test262 failed testcase list [skip ci]" \
            "$FAILED_TESTS_FILE"

  # Attempt jobs are measurements and are allowed to fail while their artifacts
  # are retried/merged. This single terminal gate is the workflow's verdict: a
  # green run means the requested full phase really ran and its authoritative
  # latest-attempt merge contains no failures, timeouts, configuration errors,
  # or incomplete shards.
  conclusion:
    needs: [plan, report, persist-failed]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Enforce authoritative test262 result
        shell: bash
        env:
          REPORT_RESULT: ${{ needs.report.result }}
          AUTHORITATIVE_PHASE: ${{ needs.report.outputs.authoritative-phase }}
          SUITE_PASSED: ${{ needs.report.outputs.suite-passed }}
          PERSIST_RESULT: ${{ needs.persist-failed.result }}
        run: |
          set -euo pipefail
          if [ "$REPORT_RESULT" != "success" ]; then
            echo "The authoritative test262 report job did not complete successfully." >&2
            exit 1
          fi
          if [ "$AUTHORITATIVE_PHASE" != "full" ]; then
            echo "The requested full test262 phase never completed; only the saved-failure preflight is available." >&2
            exit 1
          fi
          if [ "$SUITE_PASSED" != "true" ]; then
            echo "The authoritative test262 merge contains non-passing results." >&2
            exit 1
          fi
          if [ "$PERSIST_RESULT" = "failure" ] || [ "$PERSIST_RESULT" = "cancelled" ]; then
            echo "The canonical failure manifest could not be persisted safely." >&2
            exit 1
          fi
          echo "The authoritative full test262 run passed."
