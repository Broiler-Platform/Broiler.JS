name: Publish

# The only destination is nuget.org. Every published preview number is recorded as a
# v* tag on this repository, and eng/resolve-preview-version.mjs reads those tags
# alongside the feed so a number is never handed out twice.

on:
  workflow_dispatch:
    inputs:
      version-suffix:
        description: 'Optional preview.N (unused and at least the next preview). Empty selects automatically.'
        type: string
        default: ''
      dry-run:
        description: Validate and attach packages without pushing to nuget.org
        type: boolean
        default: true
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  version:
    name: Resolve preview version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      DRY_RUN: ${{ github.event_name == 'push' && 'false' || inputs.dry-run }}
    steps:
      # Tags are half the version record, so fetch all of them: a missing tag reads
      # as an unspent preview number and would be handed to a second build.
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Require a NuGet.org API key
        if: env.DRY_RUN != 'true'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::Publishing to nuget.org needs the NUGET_API_KEY repository secret."
            exit 1
          fi
      - name: Resolve version
        id: version
        env:
          VERSION_SUFFIX: ${{ inputs.version-suffix }}
        run: node eng/resolve-preview-version.mjs

  validate:
    name: Validate and pack
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      package-version: ${{ needs.version.outputs.version }}

  publish:
    name: Publish to nuget.org
    needs: [version, validate]
    runs-on: ubuntu-latest
    permissions:
      # Recording the published version as a tag is what keeps the next run's
      # numbering cumulative, so this job writes one ref and nothing else.
      contents: write
    env:
      DRY_RUN: ${{ github.event_name == 'push' && 'false' || inputs.dry-run }}
      PACKAGE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Download validated packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: artifacts
      - name: Verify consumer restore from nuget.org
        shell: pwsh
        run: ./eng/verify-feed.ps1
      # --skip-duplicate makes a re-run of a partially pushed set succeed instead of
      # failing on the packages that already landed.
      - name: Push to NuGet.org
        if: env.DRY_RUN != 'true'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: >
          dotnet nuget push 'artifacts/*.nupkg'
          --source https://api.nuget.org/v3/index.json
          --api-key "$NUGET_API_KEY" --skip-duplicate
      # Pushed with GITHUB_TOKEN, so it does not re-trigger this workflow.
      - name: Record the published version as a tag
        if: env.DRY_RUN != 'true' && github.event_name != 'push'
        run: |
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag -a "v$PACKAGE_VERSION" -m "Broiler.JS $PACKAGE_VERSION"
          git push origin "v$PACKAGE_VERSION"
      - name: Summary
        run: |
          {
            echo "### Broiler.JS $PACKAGE_VERSION"
            echo
            if [ "$DRY_RUN" = "true" ]; then
              echo 'Dry run: validated packages are attached; nothing was pushed.'
            else
              echo 'Published to nuget.org.'
            fi
            echo
            echo '```'
            ls -1 artifacts
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
